name: Rebuild README index

on:
  push:
    paths:
      - "solutions/**"
      - "scripts/build_index.py"
  schedule:
    # Rebuild every morning so the review queue is current.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index
        run: python scripts/build_index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: rebuild README index"
          git push
